name: "aws-ec2-build"

on:
  workflow_dispatch:

jobs:
  terraform:
    uses: rdavis542/aws-github-workflows/.github/workflows/tf-plan-apply.yml@main
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    with:
      aws_region: us-east-1
      var_file: terraform-ec2.tfvars
    secrets: inherit
